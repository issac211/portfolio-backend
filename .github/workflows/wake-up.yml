name: Wake Up Render Backend

on:
  schedule:
    # Runs every 15 minutes, between 05:00 and 21:00 UTC
    - cron: "*/15 2-21 * * *"

  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  ping-server:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP GET request to Health Check
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          echo "Pinging backend health check..."
          response=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL")
          echo "HTTP Status: $response"
          if [ "$response" -eq 200 ]; then
            echo "Server is healthy and awake!"
            exit 0
          else
            echo "Server returned status $response (might be waking up)"
            exit 0
          fi
