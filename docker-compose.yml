services:
  backend:
    image: portfolio-backend:v1.2
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Live development reload: maps host source files directly into the container
      - ./src:/app/src
      - ./alembic:/app/alembic
      # State persistence: maps uploads on host machine to prevent data loss on container reset
      - ./uploads:/app/uploads
    # Development override with hot-reload enabled
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
